name: Daily Build

on:
  push:
    branches: [ccr-e93188a6-grrqko, main]
    tags: ['v*']
  workflow_dispatch:

# Serialize updates of the fixed nightly tag and its assets.
concurrency:
  group: rikka-root-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  ORG_GRADLE_PROJECT_rikkarootReleaseAbis: arm64-v8a

jobs:
  build:
    if: >-
      github.repository == 'mishaqp/Rikka-Root' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: sdkmanager 'platforms;android-37.2' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Test CI build checks
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Unit tests
        run: ./gradlew test --no-configuration-cache

      - name: Lint and inherited-error gate
        shell: bash
        run: |
          python .github/scripts/android_build.py clear-lint
          set +e
          ./gradlew lint --continue --no-configuration-cache
          lint_exit=$?
          set -e
          python .github/scripts/android_build.py check-lint --exit-code "$lint_exit"

      - name: Publish test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/lint-results-debug.*
            **/build/reports/tests/**
            **/build/test-results/test*/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14

      # Reuse upstream's KEY_BASE64 -> app/app.key and SIGNING_CONFIG -> local.properties.
      # Values are environment inputs, never shell interpolation or command arguments.
      - name: Prepare upstream signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: python .github/scripts/android_build.py prepare-signing

      - name: Build signed arm64 release
        run: ./gradlew assembleRelease --no-configuration-cache

      - name: Remove temporary signing files
        if: always()
        run: python .github/scripts/android_build.py cleanup-signing

      - name: Prepare versioned APK
        id: apk
        run: python .github/scripts/android_build.py prepare-apk

      - name: Verify APK signature and original certificate
        run: python .github/scripts/android_build.py verify-apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Move the fixed nightly tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/android_build.py prepare-nightly

      # Keep upstream's direct-download nightly prerelease; v* tags publish normal releases.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Rikka-Root {0}', steps.apk.outputs.version) || 'Nightly Build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          target_commitish: ${{ github.sha }}
          body_path: build/ci/release-notes.txt
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Remove previous nightly APKs after successful upload
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/android_build.py cleanup-nightly

      - name: Final apksigner verification and certificate SHA-256
        run: python .github/scripts/android_build.py verify-apk
